name: Keep-number eSIM lead scan

# Scans public Telegram channels every 6 hours for new cheap foreign
# number eSIM leads (保号卡): one-time buyout like the turtle card
# (~37 RMB) or keep cost <= ~10 RMB/year, no real-name, no passport,
# white-card writable, activatable from mainland China.
# A paper match is only a CANDIDATE in KEEP_NUMBER_LEADS.md -- it never
# auto-notifies. The file only changes when a NEW candidate appears, and
# a hook watching the file wakes Muse, who verifies live before telling
# Wang. Each run commits keep_number_state.json (keeps the repo active
# so GitHub does not pause the schedule after 60 days without pushes).

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run scanner
        run: python3 keep_number_scan.py
      - name: Commit state
        run: |
          git config user.name "keep-number-watch-bot"
          git config user.email "keep-number-watch-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "keep-number scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
